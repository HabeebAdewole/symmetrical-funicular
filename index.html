<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F6F5" />
    <!-- iOS: launch from the home screen full screen, with Kova's own name and icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kova" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Stops iOS turning numbers (balances, addresses) into phone-number links -->
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Kova — a mobile-first crypto wallet demo with live prices. All funds are mocked."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Kova Wallet</title>
    <script>
      // Set the theme before React loads, so dark-mode users never see a white flash
      try {
        const pref = JSON.parse(localStorage.getItem('kova-preferences'))?.state?.theme ?? 'system'
        const dark =
          pref === 'dark' ||
          (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0B0D0C' : '#F4F6F5')
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
